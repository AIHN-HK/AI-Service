services:
  app:
    image: ${DOCKER_IMAGE:-chatbot-service:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env

    environment:
      - APP_ENV=dev

    volumes:
      # - ./app:/app/app  # Dev only: mount source code for hot-reload
      - ./data:/app/data
      - ./logs:/app/logs

    networks:
      - chatbot_network

    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:8
    container_name: chatbot_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379" # Bind to localhost only
    volumes:
      - redis_data:/data
    networks:
      - chatbot_network
    environment:
      - REDIS_ARGS=--appendonly yes

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  mongodb:
    image: mongo:7.0
    container_name: chatbot_mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-rootpassword}
    volumes:
      - mongodb_data:/data/db
    networks:
      - chatbot_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot_qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - chatbot_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  chatbot_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  redis_data:
  mongodb_data:
  qdrant_data:
